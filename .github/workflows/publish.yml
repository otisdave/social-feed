name: Refresh and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: social-feed-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scraper
        timeout-minutes: 3
        run: python -m pip install -r requirements.txt
      - name: Install browser
        timeout-minutes: 5
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: |
          python -m unittest discover -s tests -v
          python tests/browser_smoke.py
      - name: Refresh feeds
        id: refresh
        continue-on-error: true
        run: python -m social_feed
      - name: Preserve archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/feed.json site/feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh publication archive"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failures
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Feed refresh failed. Inspect the refresh logs and source status on the site."
          exit 1
